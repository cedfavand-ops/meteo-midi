name: Prévisions J+1

on:
  schedule:
    - cron: "45 15 * * *"
    - cron: "45 16 * * *"
  workflow_dispatch:

permissions:
  contents: write      # nécessaire pour enregistrer l'archive dans le dépôt
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer la page
        run: |
          mkdir -p site
          python previ.py --out site/index.html
          if [ -d icons ]; then cp -r icons site/icons; fi

      - name: Vérifier le contenu publié
        run: |
          ls -la site
          test -s site/index.html || (echo "ERREUR : site/index.html est absent ou vide" && exit 1)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

      # --- Archivage (après la publication : un échec ici ne bloque jamais la page) ---
      - name: Archiver prévisions et observations
        continue-on-error: true
        env:
          INFOCLIMAT_TOKEN: ${{ secrets.INFOCLIMAT_TOKEN }}
        run: python archive.py

      - name: Enregistrer l'archive dans le dépôt
        continue-on-error: true
        run: |
          git config user.name "meteo-midi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Rien de nouveau à enregistrer."
          else
            git commit -m "Archive $(date -u +%F)"
            git pull --rebase
            git push
          fi
